<!doctype html>
<html><head><meta charset="utf-8" />
<title>Ed.it</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0b;color:#ececf1;
    font:14px -apple-system,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-app-region:drag;}
  .box{text-align:center;}
  .logo{font:600 24px "SF Pro Display",system-ui;letter-spacing:-0.02em;}
  .dot{color:#ffd28a;}
  .sub{color:#5a5a66;margin-top:8px;font-size:12px;}
  .dots{margin-top:18px;color:#5a5a66;}
  .dots span{display:inline-block;animation:p 1.2s infinite;margin:0 1px;}
  .dots span:nth-child(2){animation-delay:.15s}
  .dots span:nth-child(3){animation-delay:.3s}
  @keyframes p{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style></head>
<body><div class="box">
  <div class="logo">Ed<span class="dot">.</span>it</div>
  <div class="sub">waking up the agent</div>
  <div class="dots"><span>•</span><span>•</span><span>•</span></div>
</div></body></html>
